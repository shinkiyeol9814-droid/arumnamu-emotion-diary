<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아름나무반 감정일기</title>
<link rel="icon" type="image/png" href="img/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="brand" data-go="home" title="처음 화면">
    <img src="img/icon-64.png" alt="">
    <span>아름나무반 감정일기</span>
  </button>
  <div class="today" id="todayLabel"></div>
  <nav>
    <button class="nav-btn" data-go="home">🏠 처음</button>
    <button class="nav-btn" data-go="board">🌳 모아보기</button>
    <button class="nav-btn ghost" data-go="settings">⚙️ 설정</button>
  </nav>
</header>

<main>
  <!-- 1. 친구 고르기 -->
  <section id="home" class="screen">
    <h1 class="title">누가 일기를 쓸까요?</h1>
    <p class="sub">내 이름을 눌러 주세요 <span id="doneCount"></span></p>
    <p class="status" id="syncStatus" hidden></p>
    <div id="kidGrid" class="kid-grid"></div>
  </section>

  <!-- 2. 감정 고르기 -->
  <section id="pick" class="screen" hidden>
    <h1 class="title rainbow"><span id="pickName"></span>, 오늘의 감정을 골라보세요</h1>
    <div id="emotionGrid" class="emotion-grid"></div>
    <div class="actions"><button class="btn ghost" data-go="home">← 뒤로</button></div>
  </section>

  <!-- 3. 일기 쓰기 -->
  <section id="write" class="screen" hidden>
    <div class="book">
      <div class="page left">
        <div class="tree">
          <img id="writeEmotionImg" alt="">
        </div>
        <div class="emotion-name" id="writeEmotionName"></div>
        <button class="btn small ghost" id="changeEmotion">감정 다시 고르기</button>
      </div>
      <div class="page right">
        <div class="who"><b id="writeName"></b>의 감정일기 · <span id="writeDate"></span></div>
        <label class="q" for="reason">왜 그런 기분이 들었나요?</label>
        <textarea id="reason" maxlength="400" placeholder="여기에 써 보세요. (선생님이 대신 써 주셔도 좋아요)"></textarea>
        <div class="weather-row">
          <span>오늘 날씨</span>
          <div id="weather" class="weather"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="backToPick">← 뒤로</button>
      <button class="btn primary" id="saveBtn">다 썼어요! 💛</button>
    </div>
  </section>

  <!-- 저장 완료 -->
  <section id="done" class="screen" hidden>
    <div class="done-card">
      <img id="doneImg" alt="">
      <h1 class="title">잘 했어요! <span id="doneName"></span></h1>
      <p class="sub" id="doneNote"></p>
      <button class="btn primary" data-go="home">다음 친구</button>
    </div>
  </section>

  <!-- 4. 모아보기 -->
  <section id="board" class="screen" hidden>
    <div id="calendar" class="calendar"></div>
    <h2 class="board-title" id="boardTitle"></h2>
    <div id="tally" class="tally"></div>
    <div id="boardGrid" class="board-grid"></div>
  </section>

  <!-- 친구 한 명 기록 -->
  <section id="kid" class="screen" hidden>
    <div class="board-head">
      <button class="btn small ghost" data-go="board">← 모아보기</button>
      <h2 id="kidTitle"></h2>
    </div>
    <div id="kidTally" class="tally"></div>
    <div id="kidHistory" class="history"></div>
  </section>

  <!-- 연결 설정 -->
  <section id="settings" class="screen" hidden>
    <div class="panel narrow">
      <h2>구글 시트 연결</h2>
      <p>이 노트북에서 처음 한 번만 반 비밀번호를 입력하면 돼요.</p>
      <input type="password" id="classKey" inputmode="numeric" autocomplete="off" placeholder="반 비밀번호">
      <button class="btn primary" id="connectBtn">연결하기</button>
      <p class="err" id="connectErr"></p>
      <p class="hint" id="connectInfo"></p>
      <div class="row">
        <button class="btn small ghost" id="disconnectBtn">이 노트북 연결 해제</button>
        <button class="btn small ghost" id="reloadBtn">🔄 새로 불러오기</button>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<div id="loading" class="loading" hidden>불러오는 중…</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
