<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아름나무반 감정일기</title>
<link rel="icon" type="image/png" href="img/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="brand" data-go="home" title="처음 화면">
    <img src="img/icon-64.png" alt="">
    <span>아름나무반 감정일기</span>
  </button>
  <div class="today" id="todayLabel"></div>
  <nav>
    <button class="nav-btn" data-go="home">🏠 처음</button>
    <button class="nav-btn" data-go="board">🌳 모아보기</button>
    <button class="nav-btn ghost" data-go="teacher">🔒 선생님</button>
  </nav>
</header>

<main>
  <!-- 1. 친구 고르기 -->
  <section id="home" class="screen">
    <h1 class="title">누가 일기를 쓸까요?</h1>
    <p class="sub">내 이름을 눌러 주세요 <span id="doneCount"></span></p>
    <div id="kidGrid" class="kid-grid"></div>
  </section>

  <!-- 2. 감정 고르기 -->
  <section id="pick" class="screen" hidden>
    <h1 class="title rainbow"><span id="pickName"></span>, 오늘의 감정을 골라보세요</h1>
    <div id="emotionGrid" class="emotion-grid"></div>
    <div class="actions"><button class="btn ghost" data-go="home">← 뒤로</button></div>
  </section>

  <!-- 3. 일기 쓰기 -->
  <section id="write" class="screen" hidden>
    <div class="book">
      <div class="page left">
        <div class="tree">
          <img id="writeEmotionImg" alt="">
        </div>
        <div class="emotion-name" id="writeEmotionName"></div>
        <button class="btn small ghost" id="changeEmotion">감정 다시 고르기</button>
      </div>
      <div class="page right">
        <div class="who"><b id="writeName"></b>의 감정일기 · <span id="writeDate"></span></div>
        <label class="q" for="reason">왜 그런 기분이 들었나요?</label>
        <textarea id="reason" maxlength="400" placeholder="여기에 써 보세요. (선생님이 대신 써 주셔도 좋아요)"></textarea>
        <div class="weather-row">
          <span>오늘 날씨</span>
          <div id="weather" class="weather"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="backToPick">← 뒤로</button>
      <button class="btn primary" id="saveBtn">다 썼어요! 💛</button>
    </div>
  </section>

  <!-- 저장 완료 -->
  <section id="done" class="screen" hidden>
    <div class="done-card">
      <img id="doneImg" alt="">
      <h1 class="title">잘 했어요! <span id="doneName"></span></h1>
      <p class="sub">일기가 저장되었어요. 다음 친구에게 넘겨 주세요 🌱</p>
      <button class="btn primary" data-go="home">다음 친구</button>
    </div>
  </section>

  <!-- 4. 모아보기 -->
  <section id="board" class="screen" hidden>
    <div class="board-head">
      <button class="btn small ghost" id="prevDay">◀</button>
      <input type="date" id="boardDate">
      <button class="btn small ghost" id="nextDay">▶</button>
      <button class="btn small ghost" id="todayBtn">오늘</button>
      <span class="spacer"></span>
      <button class="btn small ghost" id="printBtn">🖨️ 인쇄</button>
    </div>
    <div id="tally" class="tally"></div>
    <div id="boardGrid" class="board-grid"></div>
  </section>

  <!-- 친구 한 명 기록 -->
  <section id="kid" class="screen" hidden>
    <div class="board-head">
      <button class="btn small ghost" data-go="board">← 모아보기</button>
      <h2 id="kidTitle"></h2>
    </div>
    <div id="kidTally" class="tally"></div>
    <div id="kidHistory" class="history"></div>
  </section>

  <!-- 5. 선생님 -->
  <section id="teacher" class="screen" hidden>
    <div id="lockBox" class="panel">
      <h2>선생님 메뉴</h2>
      <p>비밀번호를 입력하세요. (처음 비밀번호: 1234)</p>
      <input type="password" id="pin" inputmode="numeric" maxlength="8">
      <button class="btn primary" id="unlockBtn">열기</button>
      <p class="err" id="pinErr"></p>
    </div>
    <div id="teacherBox" hidden>
      <div class="panel">
        <h2>친구 이름</h2>
        <p>한 줄에 한 명씩 적어 주세요. (줄 순서 = 화면 순서) 실명 대신 별명을 써도 좋아요.</p>
        <textarea id="kidNames" rows="12"></textarea>
        <button class="btn primary" id="saveKids">이름 저장</button>
        <p class="hint">이름을 지워도 그 친구의 지난 기록은 남아 있어요.</p>
      </div>
      <div class="panel">
        <h2>백업 · 내보내기</h2>
        <p>기록은 이 노트북의 브라우저 안에만 저장돼요. 가끔 백업 파일을 받아 두세요.</p>
        <div class="row">
          <button class="btn" id="exportJson">💾 백업 파일 받기</button>
          <label class="btn">📂 백업 불러오기<input type="file" id="importJson" accept=".json" hidden></label>
          <button class="btn" id="exportCsv">📊 엑셀용(CSV) 받기</button>
        </div>
      </div>
      <div class="panel">
        <h2>비밀번호 바꾸기</h2>
        <div class="row">
          <input type="password" id="newPin" inputmode="numeric" maxlength="8" placeholder="새 비밀번호">
          <button class="btn" id="savePin">바꾸기</button>
        </div>
      </div>
      <div class="panel danger">
        <h2>기록 지우기</h2>
        <div class="row">
          <button class="btn" id="clearDay">모아보기에서 보던 날짜 기록 지우기</button>
          <button class="btn" id="clearAll">모든 기록 지우기</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
